<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirmation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="appointment-confirmation">
<div class="site-shell confirmation-shell">
    <nav class="topbar">
        <div class="brand">Tutor Scheduler</div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/slots">Browse Slots</a>
            <a href="/appointments">My Appointments</a>
        </div>
        <div class="cta-wrap">
            <a class="button" href="/appointments">View Appointments &rsaquo;</a>
        </div>
    </nav>

    <main class="panel" th:if="${appointment != null}">
        <div class="panel-body">
            <div class="slots-header">
                <div>
                    <h1>Appointment Confirmed</h1>
                    <p class="subhead">Your booking is complete and saved in your appointments list.</p>
                </div>
                <div class="chip" th:text="${appointment.status}"></div>
            </div>

            <div class="details-grid">
                <div class="detail">
                    <div class="label">Lesson ID</div>
                    <div class="value" th:text="${appointment.lessonId}"></div>
                </div>
                <div class="detail">
                    <div class="label">Date</div>
                    <div class="value" th:text="${appointment.date}"></div>
                </div>
                <div class="detail">
                    <div class="label">Start Time</div>
                    <div class="value" th:text="${appointment.startTime}"></div>
                </div>
                <div class="detail">
                    <div class="label">Student</div>
                    <div class="value" th:text="${appointment.studentName}"></div>
                </div>
                <div class="detail">
                    <div class="label">Tutor</div>
                    <div class="value" th:text="${appointment.tutorName}"></div>
                </div>
                <div class="detail">
                    <div class="label">Subject</div>
                    <div class="value" th:text="${appointment.subjectName}"></div>
                </div>
                <div class="detail">
                    <div class="label">Location</div>
                    <div class="value" th:text="${appointment.locationName}"></div>
                </div>
                <div class="detail">
                    <div class="label">Email</div>
                    <div class="value" th:text="${appointment.studentEmail}"></div>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
