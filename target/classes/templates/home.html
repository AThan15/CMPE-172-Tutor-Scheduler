<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tutor Scheduler</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="home">
<div class="site-shell">
    <nav class="topbar">
        <div class="brand">Tutor Scheduler</div>
        <div class="nav-links">
            <a class="active" href="/">Home</a>
            <a href="/slots">Browse Slots</a>
            <a href="/appointments">My Appointments</a>
        </div>
        <div class="cta-wrap">
            <a class="button" href="/appointments/new">Book a Session &rsaquo;</a>
        </div>
    </nav>

    <main>
        <section class="hero">
            <div class="hero-copy">
                <h1 class="page-title">Find the right <em>tutor</em>,<br>at the right time.</h1>
                <p class="subhead">Browse available sessions across all subjects, book instantly, and get the academic support you need.</p>
                <div class="action-row">
                    <a class="button secondary" href="/slots">View Available Slots</a>
                    <a class="button secondary" href="/appointments">My Appointments</a>
                </div>
            </div>
            <div class="hero-art" aria-hidden="true"></div>
        </section>
    </main>
</div>
</body>
</html>
