<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Appointments</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="appointments">
<div class="site-shell appointments-shell">
    <nav class="topbar">
        <div class="brand">Tutor Scheduler</div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/slots">Browse Slots</a>
            <a class="active" href="/appointments">My Appointments</a>
        </div>
        <div class="cta-wrap">
            <a class="button" href="/appointments/new">Book a Session &rsaquo;</a>
        </div>
    </nav>

    <main class="panel">
        <div class="panel-body">
            <div class="slots-header">
                <div>
                    <h1>My Appointments</h1>
                    <p class="subhead">Current bookings and tutoring schedule.</p>
                </div>
                <div class="chip"><span th:text="${#lists.size(appointments)}">0</span> booked</div>
            </div>

            <table>
                <thead>
                <tr>
                    <th>Lesson ID</th>
                    <th>Status</th>
                    <th>Date</th>
                    <th>Start</th>
                    <th>Student</th>
                    <th>Tutor</th>
                    <th>Subject</th>
                    <th>Location</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="appointment : ${appointments}">
                    <td th:text="${appointment.lessonId}"></td>
                    <td><span class="badge" th:text="${appointment.status}"></span></td>
                    <td th:text="${appointment.date}"></td>
                    <td th:text="${appointment.startTime}"></td>
                    <td th:text="${appointment.studentName}"></td>
                    <td th:text="${appointment.tutorName}"></td>
                    <td th:text="${appointment.subjectName}"></td>
                    <td th:text="${appointment.locationName}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
