<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book Appointment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="appointment-form">
<div class="site-shell form-shell">
    <nav class="topbar">
        <div class="brand">Tutor Scheduler</div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/slots">Browse Slots</a>
            <a href="/appointments">My Appointments</a>
        </div>
        <div class="cta-wrap">
            <a class="button" href="/slots">Back to Slots &rsaquo;</a>
        </div>
    </nav>

    <main class="panel">
        <div class="panel-body">
            <div class="slots-header">
                <div>
                    <h1>Book Appointment</h1>
                    <p class="subhead">Enter your details to confirm the selected tutoring session.</p>
                </div>
            </div>

            <form method="post" action="/appointments" th:object="${request}">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="studentName">Student Name</label>
                        <input id="studentName" name="studentName" type="text" th:value="*{studentName}" required>
                    </div>

                    <div class="form-group">
                        <label for="studentEmail">Student Email</label>
                        <input id="studentEmail" name="studentEmail" type="email" th:value="*{studentEmail}" required>
                    </div>

                    <div class="form-group">
                        <label for="subjectName">Subject</label>
                        <input id="subjectName" name="subjectName" type="text" th:value="*{subjectName}">
                    </div>

                    <div class="form-group">
                        <label for="date">Date (YYYY-MM-DD)</label>
                        <input id="date" name="date" type="text" th:value="*{date}" required>
                    </div>

                    <div class="form-group">
                        <label for="startTime">Start Time (HH:MM)</label>
                        <input id="startTime" name="startTime" type="text" th:value="*{startTime}" required>
                    </div>

                    <input type="hidden" name="tutorId" th:value="*{tutorId}">
                </div>

                <div class="action-row">
                    <button class="button" type="submit">Confirm Booking &rsaquo;</button>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
