<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tutor Scheduler</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="home">
<div class="site-shell">
    <nav class="topbar">
        <div class="brand">Tutor Scheduler</div>
        <div class="nav-links">
            <a class="active" href="/">Home</a>
            <a href="/slots">Student View</a>
            <a href="/tutor">Tutor Portal</a>
        </div>
        <div class="cta-wrap"></div>
    </nav>

    <main>
        <section class="hero">
            <div class="hero-copy">
                <h1 class="page-title">Choose your <em>role</em> and<br>manage tutoring sessions.</h1>
                <p class="subhead">Students can browse and book appointments. Tutors can publish availability and view bookings without manually editing MySQL.</p>
                <div class="action-row">
                    <a class="button secondary" href="/slots">Continue as Student</a>
                    <a class="button secondary" href="/tutor">Continue as Tutor</a>
                </div>
            </div>
            <div class="hero-art" aria-hidden="true"></div>
        </section>
    </main>
</div>
</body>
</html>
